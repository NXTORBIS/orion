# ORION-1.0 — single 24–80 GB GPU (Linux), LoRA SFT on Qwen3.8-27B or Qwen3.5-35B-A3B-Base.
# Not runnable on the laptop; syntax-checked by tests/test_train_configs.py.
run_name: orion-1.0-lora-sft
experiment: orion-1.0
model: models/Qwen3.8-27B
device: auto
dtype: bf16
gradient_checkpointing: true
train_file: data/processed/mix_v1/sft_train.jsonl
eval_file: data/processed/mix_v1/sft_validation.jsonl
output_dir: checkpoints/orion-1.0-lora-sft
seed: 0

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear

hyperparameters:
  max_length: 8192
  packing: true
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_steps: 100
  batch_size: 2
  grad_accum: 16
  epochs: 2
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
report_to: [mlflow]
