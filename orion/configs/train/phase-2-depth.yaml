run_name: orion-phase-2-depth
experiment: superior-ai-phase-2
model: models/Qwen3.5-0.8B-Base
device: cpu
dtype: fp32
gradient_checkpointing: false
train_file: data/processed/chatgpt_level_combined/sft_train.jsonl
eval_file: data/processed/chatgpt_level_combined/sft_validation.jsonl
output_dir: checkpoints/orion-phase-2-depth
seed: 42

lora:
  r: 24
  alpha: 48
  dropout: 0.05
  target_modules: all-linear

hyperparameters:
  max_length: 768
  learning_rate: 1.5e-4
  lr_scheduler: cosine
  warmup_steps: 20
  batch_size: 3
  grad_accum: 3
  epochs: 1
  max_steps: 1000
  logging_steps: 20
  save_steps: 100
  eval_steps: 100

report_to: []
