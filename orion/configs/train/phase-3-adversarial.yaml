run_name: orion-phase-3-adversarial
experiment: superior-ai-phase-3
model: models/Qwen3.5-0.8B-Base
device: cpu
dtype: fp32
gradient_checkpointing: false
train_file: data/processed/chatgpt_level_combined/sft_train.jsonl
eval_file: data/processed/chatgpt_level_combined/sft_validation.jsonl
output_dir: checkpoints/orion-phase-3-adversarial
seed: 42

lora:
  r: 28
  alpha: 56
  dropout: 0.05
  target_modules: all-linear

hyperparameters:
  max_length: 1024
  learning_rate: 1.2e-4
  lr_scheduler: cosine
  warmup_steps: 30
  batch_size: 4
  grad_accum: 2
  epochs: 1
  max_steps: 1000
  logging_steps: 30
  save_steps: 100
  eval_steps: 100

report_to: []
