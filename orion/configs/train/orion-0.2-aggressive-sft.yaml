# ORION-0.2 Aggressive SFT Configuration
# Targets: Sequences (0%), Systems (0%), Science (40%)
# Focus: Fix critical failures identified in baseline

model_name_or_path: Qwen/Qwen3.5-0.8B-Base
adapter_name_or_path: checkpoints/orion-0.1-synthmath-lora/final

output_dir: checkpoints/orion-0.2-aggressive-sft

training_args:
  num_train_epochs: 2
  max_steps: 300
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_steps: 30
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2

  logging_steps: 10
  save_steps: 50
  eval_steps: 50
  save_total_limit: 2

  fp16: false
  dataloader_num_workers: 2
  seed: 42
  report_to: ["mlflow"]
  logging_dir: mlruns/

lora_config:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: CAUSAL_LM

sft_config:
  max_seq_length: 512
  packing: false
