# ORION-0.2 Fast-Track Training Configuration
# Optimized for SPEED: 30-60 minutes total cycle
# Quality: Target >60% accuracy with aggressive regularization

model_name_or_path: Qwen/Qwen3.5-0.8B-Base
adapter_name_or_path: checkpoints/orion-0.1-synthmath-lora/final

output_dir: checkpoints/orion-0.2-fast-track

training_args:
  num_train_epochs: 1
  max_steps: 100
  learning_rate: 0.0003
  lr_scheduler_type: linear
  warmup_steps: 5
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1

  logging_steps: 10
  save_steps: 25
  eval_steps: 25
  save_total_limit: 1

  fp16: false
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
  seed: 42
  report_to: ["mlflow"]
  logging_dir: mlruns/

lora_config:
  r: 8
  lora_alpha: 16
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.1
  bias: "none"
  task_type: CAUSAL_LM

sft_config:
  max_seq_length: 256
  packing: true
