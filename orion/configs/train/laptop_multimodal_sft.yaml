# ORION-0.2 Training Configuration
# Supervised Fine-Tuning (SFT) on Multimodal Dataset
# Base: Qwen3.5-0.8B-Base
# Adapter: LoRA (r=16, alpha=32) on top of ORION-0.1 adapter

model_name_or_path: Qwen/Qwen3.5-0.8B-Base
adapter_name_or_path: checkpoints/orion-0.1-synthmath-lora/final

# Training Data
train_dataset: data/raw/synth_math/train.jsonl
# Additional sources will be merged:
# - data/raw/synth_reasoning/train.jsonl (when available)
# - data/raw/synth_science/train.jsonl (generated)

output_dir: checkpoints/orion-0.2-multimodal-sft

# Training Arguments
training_args:
  num_train_epochs: 1
  max_steps: 500  # ~0.125 epochs through 4K samples
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_steps: 50
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4

  # Logging & Saving
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3

  # Hardware
  fp16: true
  dataloader_num_workers: 2
  dataloader_drop_last: true
  optim: paged_adamw_8bit
  max_grad_norm: 1.0

  # Misc
  seed: 42
  report_to: ["mlflow"]
  logging_dir: mlruns/
  push_to_hub: false

# LoRA Configuration
lora_config:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: CAUSAL_LM

# SFT-specific options
sft_config:
  max_seq_length: 512
  packing: false
  formatting_func: null  # Use default (messages format)

# Data sampling (when multimodal dataset is ready)
data_config:
  sources:
    - path: data/raw/synth_math/train.jsonl
      weight: 0.4
    - path: data/raw/synth_reasoning/train.jsonl
      weight: 0.15
    - path: data/raw/synth_science/train.jsonl
      weight: 0.15
  stratified_sampling: true
  shuffle: true
  seed: 42

# Evaluation during training
eval_strategy: "steps"
eval_steps: 100
eval_dataset: data/raw/synth_math/test.jsonl

# Callbacks
early_stopping:
  enabled: false  # First pass, no early stopping
  patience: 3
  threshold: 0.001
