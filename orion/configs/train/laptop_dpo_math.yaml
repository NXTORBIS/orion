# DPO on verifier-filtered self-play pairs (chosen = verified-correct sample, rejected = wrong
# sample for the same prompt). Pairs are produced by orion.train.dpo.make_verified_pairs.
run_name: orion-0.1-dpo-math
experiment: orion-0.1
model: models/Qwen3.5-0.8B-Base
adapter: checkpoints/orion-0.1-synthmath-lora/final   # continue from the SFT policy (merged before fresh LoRA)
device: cpu
dtype: fp32
train_file: data/processed/synth_math_v1/dpo_pairs.jsonl
output_dir: checkpoints/orion-0.1-dpo-math
seed: 0
lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: all-linear}
hyperparameters:
  beta: 0.1
  loss_type: sigmoid
  max_length: 512
  learning_rate: 5.0e-6
  batch_size: 1
  grad_accum: 8
  epochs: 1
  max_steps: 30
  logging_steps: 2
  save_steps: 30
report_to: [mlflow]
