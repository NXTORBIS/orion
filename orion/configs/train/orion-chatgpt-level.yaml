# ORION ChatGPT-Level Continuous Training Configuration
# Aggressive multi-domain training targeting ChatGPT parity across all capabilities
# Run indefinitely until reaching 75%+ blended average

model_name_or_path: Qwen/Qwen3.5-0.8B-Base
adapter_name_or_path: checkpoints/orion-0.1-synthmath-lora/final

output_dir: checkpoints/orion-chatgpt-level

training_args:
  num_train_epochs: 3
  max_steps: 1000
  learning_rate: 0.00008
  lr_scheduler_type: cosine
  warmup_steps: 100
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2

  logging_steps: 50
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3

  fp16: false
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
  seed: 42
  report_to: ["mlflow"]
  logging_dir: mlruns/

lora_config:
  r: 32
  lora_alpha: 64
  target_modules: ["q_proj", "v_proj", "k_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: CAUSAL_LM

sft_config:
  max_seq_length: 1024
  packing: true

# Extended training data: 50,000+ examples across 8 domains
# ChatGPT-level requires breadth, depth, and quality
training_data:
  # Foundation: Math (2,000 examples)
  synth-math: 2000

  # Science: Physics, Chemistry, Biology (10,500 examples)
  synth-science: 10500

  # Sequences: Pattern recognition (800 examples)
  synth-sequences: 800

  # Systems: Equation solving (600 examples)
  synth-systems: 600

  # Coding: Algorithms, debugging (800 examples)
  synth-coding: 800

  # Reasoning: Logic, common sense (1,000 examples)
  synth-reasoning: 1000

  # Knowledge: History, geography, culture (1,000 examples)
  synth-knowledge: 1000

  # Instruction Following: Format, constraints, tone, multi-turn (1,500 examples)
  synth-instruction: 1500
