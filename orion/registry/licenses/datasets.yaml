# ORION dataset license registry (project brief §29).
# The "clean" rule is defined in docs/04_data_training_stack.md §1: dataset license permits
# commercial training AND every generator model permits training on its outputs AND no
# closed-model outputs.
#
# verified: "hf-api" = license tag and file sizes checked on the Hugging Face API (2026-09-11);
#           "research" = cited web research only.
# use: train | eval | pipeline-validation
# status: selected | candidate | eval-only | excluded
# Not legal advice. legal_review must be "done" before any commercial release.

schema_version: 1
last_reviewed: "2026-09-11"
legal_review: pending

datasets:
  # ---------------- evaluation (never trained on; feed the 13-gram decontamination index) ----------------
  - id: gsm8k-platinum
    repo: madrylab/gsm8k-platinum
    license: MIT
    verified: [hf-api]
    size_mb: 0.4
    generators: [human]
    use: eval
    notes: "relabeled GSM8K test set; replaces the saturated and noisy original test split"
    status: selected

  - id: gsm8k
    repo: openai/gsm8k
    config: main
    license: MIT
    verified: [hf-api]
    size_mb: 2.7
    generators: [human]
    use: "train split -> small math SFT; test split -> decontamination index only"
    status: selected

  - id: math-500
    repo: HuggingFaceH4/MATH-500
    license: "none on card; source dataset (MATH, Hendrycks et al.) is MIT"
    verified: [hf-api]
    size_mb: 0.4
    generators: [human]
    use: eval
    notes: "reported memorized by some model families; interpret with care"
    status: selected

  - id: mmlu-pro
    repo: TIGER-Lab/MMLU-Pro
    license: MIT
    verified: [hf-api]
    size_mb: 4.2
    use: eval
    status: selected

  - id: ifeval
    repo: google/IFEval
    license: Apache-2.0
    verified: [hf-api]
    size_mb: 0.2
    use: eval
    notes: "saturated at the frontier; IFBench (allenai/IFBench_test, ODC-By) is the successor"
    status: selected

  - id: humanevalplus
    repo: evalplus/humanevalplus
    license: Apache-2.0
    verified: [hf-api]
    size_mb: 2.9
    use: eval
    notes: "tests are executed in the ORION code sandbox"
    status: selected

  - id: mbppplus
    repo: evalplus/mbppplus
    license: Apache-2.0
    verified: [hf-api]
    size_mb: 1.1
    use: eval
    status: selected

  - id: gpqa-diamond
    repo: Idavidrein/gpqa
    license: CC-BY-4.0
    verified: [research]
    gated: true
    use: eval
    rule: "canary string; never copy outside evals/, never post examples"
    status: candidate

  - id: hle
    repo: cais/hle
    license: MIT
    verified: [research]
    gated: true
    use: eval
    rule: "canary string; audits found 18-29% of chem/bio answers flawed"
    status: candidate

  - id: aime-2026
    repo: MathArena/aime_2026
    license: CC-BY-NC-SA-4.0
    verified: [research]
    use: eval
    rule: "non-commercial: evaluation only, never training"
    status: eval-only

  - id: livecodebench
    repo: livecodebench/code_generation_lite
    license: "unspecified 'cc'"
    verified: [research]
    use: eval
    rule: "use only problems dated after the evaluated model's data cutoff"
    status: candidate

  # ---------------- ORION-generated, verifier-checked synthetic data ----------------
  - id: orion-synth-math
    source: "src/orion/synth/math.py (procedural templates; SymPy / enumeration verification)"
    license: "ORION project (generated by code; no model outputs)"
    generators: [procedural-code]
    use: train
    notes: "each item emitted only if generator and independent verifier agree; seeds < 1,000,000"
    status: selected

  - id: orion-synth-math-eval
    source: "src/orion/synth/math.py build_split(); seeds >= 1,000,000, problems disjoint from train"
    license: "ORION project (generated by code)"
    generators: [procedural-code]
    use: eval
    notes: "held-out procedural set; NOT a standard benchmark — standard sets need the approved eval downloads"
    status: selected

  # ---------------- pipeline validation samples (raw data to exercise every filter) ----------------
  - id: fineweb-sample
    repo: HuggingFaceFW/fineweb
    config: sample-10BT
    license: "ODC-By + Common Crawl terms of use"
    verified: [research]
    generators: [web]
    use: pipeline-validation
    notes: "raw web text: realistic spam / PII / toxicity load for filter testing"
    status: candidate

  - id: fineweb-2-sample
    repo: HuggingFaceFW/fineweb-2
    license: ODC-By
    verified: [research]
    generators: [web]
    use: pipeline-validation
    notes: "multilingual raw web for language-ID and per-language filter testing"
    status: candidate

  - id: common-pile-comma
    repo: common-pile/comma_v0.1_training_dataset
    license: "per-document open licenses (CC-BY, CC-BY-SA, public domain); card has no single license tag"
    verified: [hf-api]
    size_gb_total: 520.6
    generators: [human]
    use: [pipeline-validation, train]
    notes: "no LLM-generated text by design; honor ShareAlike attribution"
    status: candidate

  # ---------------- training candidates (clean per the rule; re-verify on the HF API before download) ----------------
  - {id: reasoning-gym, source: "PyPI reasoning-gym 0.1.25 (github.com/open-thought/reasoning-gym)", license: Apache-2.0, verified: [research], generators: [procedural-code], use: "train (RL with verifiable rewards), difficulty-controlled", status: candidate}
  - {id: openmathreasoning, repo: nvidia/OpenMathReasoning, license: CC-BY-4.0, verified: [research], generators: [DeepSeek-R1, QwQ-32B], use: train, status: candidate}
  - {id: opencodereasoning-2, repo: nvidia/OpenCodeReasoning-2, license: CC-BY-4.0, verified: [research], generators: [DeepSeek-R1, QwQ-32B], use: train, status: candidate}
  - {id: openr1-math-220k, repo: open-r1/OpenR1-Math-220k, license: Apache-2.0, verified: [research], generators: [DeepSeek-R1], notes: "Llama-3.3-70B used only as judge (label-only)", use: train, status: candidate}
  - {id: nemotron-post-training-v2, repo: nvidia/Nemotron-Post-Training-Dataset-v2, license: CC-BY-4.0, verified: [research], generators: [DeepSeek-R1-0528, Qwen3-235B, Qwen2.5-Apache], use: train, status: candidate}
  - {id: toucan-1.5m, repo: Agent-Ark/Toucan-1.5M, license: Apache-2.0, verified: [research], generators: [Qwen3-32B, Kimi-K2, gpt-oss-120b], use: "train (tool use over real MCP servers)", status: candidate}
  - {id: nemotron-agentic-v1, repo: nvidia/Nemotron-Agentic-v1, license: CC-BY-4.0, verified: [research], use: "train (agents)", status: candidate}
  - {id: dolci-think-dpo, repo: allenai/Dolci-Think-DPO-7B, license: ODC-By, verified: [research], generators: [Qwen3-32B, Qwen3-0.6B], use: "train (preference)", status: candidate}
  - {id: deepmath-103k, repo: zwhe99/DeepMath-103K, license: MIT, verified: [research], notes: "decontaminated against 14 benchmarks; GPT-4o tagged difficulty only", use: "train (RL)", status: candidate}
  - {id: codecontests, repo: deepmind/code_contests, license: CC-BY-4.0, verified: [research], notes: "scraped problems with tests; decontaminate", use: "train (RL)", status: candidate}
  - {id: docmatix, repo: HuggingFaceM4/Docmatix, license: MIT, verified: [research], generators: [Phi-3], use: "train (documents)", status: candidate}

  # ---------------- excluded ----------------
  - {id: tulu-3-sft-mixture, repo: allenai/tulu-3-sft-mixture, reason: "GPT-4o / Claude outputs; No Robots subset CC-BY-NC", status: excluded}
  - {id: tulu-3-preference, repo: allenai/llama-3.1-tulu-3-70b-preference-mixture, reason: "GPT-4o judge and completions", status: excluded}
  - {id: dolci-instruct, repo: allenai/Dolci-Instruct-SFT, reason: "GPT-4.1 / GPT-5 completions", status: excluded}
  - {id: ultrafeedback, repo: openbmb/UltraFeedback, reason: "GPT-4 judge; GPT-4/3.5, Bard, LLaMA-2 completions", status: excluded}
  - {id: skywork-reward-80k, repo: Skywork/Skywork-Reward-Preference-80K-v0.2, reason: "GPT-4/Claude-3 and Llama-3 content; no license", status: excluded}
  - {id: numinamath-1.5-solutions, repo: AI-MO/NuminaMath-1.5, reason: "solutions realigned by GPT-4o (problems alone allowed)", status: excluded}
  - {id: swe-smith-trajectories, repo: SWE-bench/SWE-smith, reason: "trajectories from Claude 3.7 Sonnet (tasks alone allowed)", status: excluded}
  - {id: dclm-baseline, repo: mlfoundations/dclm-baseline-1.0, reason: "card: research use only, not for production models (also taints olmo-mix-1124, Zyda-2)", status: excluded}
  - {id: magpie, repo: "Magpie-Align/*", reason: "Llama-3.1 / Qwen2.5-72B license terms attach", status: excluded}
  - {id: megamath-synthetic, repo: LLM360/MegaMath, reason: "synthetic subset from Llama-3.3-70B and Qwen2.5-72B", status: excluded}
  - {id: finetranslations, repo: HuggingFaceFW/finetranslations, reason: "translated by Gemma-3-27B -> Gemma Model Derivative", status: excluded}
  - {id: llava-onevision, repo: lmms-lab/LLaVA-OneVision-Data, reason: "academic-use card text; GPT-4V/4o subsets", status: excluded}
  - {id: olmocr-mix, repo: allenai/olmOCR-mix-0225, reason: "GPT-4o / GPT-4.1 labels", status: excluded}
  - {id: xlam-60k, repo: Salesforce/xlam-function-calling-60k, reason: "card: research purposes only", status: excluded}
  - {id: apigen-mt, repo: Salesforce/APIGen-MT-5k, reason: CC-BY-NC-4.0, status: excluded}
  - {id: kodcode, repo: KodCode/KodCode-V1, reason: "CC-BY-NC-4.0; GPT-4o solutions", status: excluded}
  - {id: am-distilled, repo: "a-m-team/AM-*", reason: "research-only / CC-BY-NC-4.0", status: excluded}
