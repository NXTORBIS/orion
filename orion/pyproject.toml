[project]
name = "orion"
version = "0.1.0.dev0"
description = "ORION: an AI research system built on open-weight models — data, verification, training, evaluation, orchestration"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14",
    "transformers>=5.17",
    "tokenizers",
    "safetensors",
    "huggingface_hub",
    "accelerate>=1.15",
    "peft>=0.20",
    "trl>=1.13",
    "datasets>=5.0",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
    "sympy>=1.14",
    "datasketch>=2.0",
    "jsonschema>=4.26",
    "mlflow>=3.16",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
data = ["fasttext-wheel>=0.9.2"]
rl = ["reasoning-gym>=0.1.25"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
